name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · typecheck, build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Postgres with pgvector (the migration bootstrap installs the `vector`
    # extension) for the integration tests.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: compliancecore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d compliancecore"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/compliancecore?schema=global
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Type-check
        run: npm run type-check
      - name: Build
        run: npm run build
      - name: Test (unit + integration)
        run: npm test

      # Boots the built API against the service Postgres and walks the real
      # customer journey — register, onboard, scope, adopt, then every module's
      # detail and write route. Unit tests never caught the class of bug this
      # does: five POST endpoints returning 500 while every page still loaded.
      - name: E2E journey
        env:
          NODE_ENV: test
          PORT: 3002
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/compliancecore?schema=global
          # No Redis in CI: the in-memory fallback is enough for one process, and
          # the journey does not exercise queues.
          REDIS_URL: redis://localhost:6379
          ENABLE_REDIS: 'false'
          FRONTEND_URL: http://localhost:5173
          # Throwaway credentials. Real ones are never needed — the journey
          # treats an unconfigured Groq or Paystack as expected, not a failure.
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          COOKIE_SECRET: ci-cookie-secret-that-is-long-enough-32
          SIGNATURE_SECRET: ci-signature-secret-that-is-long-enough
          SMTP_HOST: localhost
          SMTP_USER: ci
          SMTP_PASS: ci
          AWS_ACCESS_KEY_ID: ci
          AWS_SECRET_ACCESS_KEY: ci
          AWS_S3_BUCKET: ci-bucket
          GROQ_API_KEY: ci-not-a-real-key
        run: |
          # RS256 keypair generated per run; nothing secret is committed.
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/jwt.pem 2>/dev/null
          openssl rsa -in /tmp/jwt.pem -pubout -out /tmp/jwt.pub 2>/dev/null
          export JWT_PRIVATE_KEY_BASE64=$(base64 -w0 /tmp/jwt.pem)
          export JWT_PUBLIC_KEY_BASE64=$(base64 -w0 /tmp/jwt.pub)

          node scripts/migrate.mjs --seed
          node scripts/migrate-tenants.mjs

          node dist/server.js &
          SERVER_PID=$!
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:3002/health >/dev/null && break
            sleep 2
          done

          set +e
          node scripts/e2e-journey.mjs
          RESULT=$?
          # Guards for defects the happy path cannot see: these assert that
          # something is REFUSED (an MFA challenge token used as a session, a
          # tenant self-activating its own subscription), so the E2E would stay
          # green while they regressed.
          if [ $RESULT -eq 0 ]; then
            node scripts/security-checks.mjs
            RESULT=$?
          fi
          # Tenant erasure from the operator console. Almost every assertion is
          # a refusal — wrong name, wrong role, own tenant — because what is
          # being deleted is a customer's entire compliance archive.
          if [ $RESULT -eq 0 ]; then
            node scripts/admin-tenant-checks.mjs
            RESULT=$?
          fi
          set -e
          kill $SERVER_PID 2>/dev/null || true
          exit $RESULT

  frontend:
    name: Frontend · lint, typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run type-check
      - name: Build
        run: npm run build
        env:
          # Build-time only; real value injected by Vercel on deploy.
          VITE_API_URL: https://api.compliancecore.io

  docker:
    name: Docker · build images (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

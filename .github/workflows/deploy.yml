name: Deploy

# Deploys on every push to the default branch, after CI passes.
# Backend  -> Railway (persistent container; runs SQL migrations on boot)
# Frontend -> Vercel  (static Vite SPA)
#
# Required repository secrets:
#   RAILWAY_TOKEN          Railway project token (Project Settings -> Tokens)
#   VERCEL_TOKEN           Vercel account token
#   VERCEL_ORG_ID          Vercel org id   (from `vercel link` / .vercel/project.json)
#   VERCEL_PROJECT_ID      Vercel project id

# Deploy ONLY after the CI workflow succeeds on main. `workflow_run` fires when
# CI finishes; the per-job `if` gate ensures a red CI (failed type-check / lint /
# build / docker) never reaches production. Manual dispatch is still allowed.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Backend -> Railway
    runs-on: ubuntu-latest
    # Only deploy when CI concluded successfully (or when manually dispatched).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy the exact commit CI validated (workflow_run checks out the
          # default branch by default, which may have moved on).
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - name: Deploy
        # Railway builds from backend/Dockerfile and runs the migrate+start
        # command from railway.json. --detach so the job doesn't hang on logs.
        run: railway up --service compliancecore-api --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-frontend:
    name: Frontend -> Vercel
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Vercel CLI
        run: npm i -g vercel
      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
